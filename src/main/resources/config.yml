settings:
  create: 25000.0 # сумма для создания клана
  create-home: 0.0 # сумма для создания кланового дома по умолчанию стоит 0 - значит бесплатно
  max-withdraw: 250000.0
  clan-tag:
    enabled: true # включена ли опция по ограничению символов в названии клана
    tag: 15 # максимально количество символов в названии клана
clan-chest: # параметры кланового сундука
  size: 54 # количество слотов в клановом сундуке
  inventory-name: "&x&F&F&E&E&0&0Клановое хранилище"
upgrade-settings:
  type-upgrade:
    type: UPGRADE-CHEST # тип кланового хранилища DEFAULT - дефолтное клановое хранилище без прокачки UPGRADE-CHEST - новый вид кланового хранилища с прокачкой, но требуется PlayerPoints
  upgrade-amount: 75.0 # ЦЕНА за прокачку кланового хранилища
  default_unlock: 9 # доступные слоты по дефолту
  unlock_slot: # на эту кнопку идет прокачка слотов
    material: LIME_DYE
    name: "&7"
    lore:
      - "&#FFB400 ⎧&r &fцена прокачки &#FFB400%clan_enderchest_upgrade_amount% &fпоинтов"

      - "&#FFB400 ⎩&r &fНажмите чтобы разблокировать слот"
  lock-slot: # заблокированный слот, нажатие на него не вызывает прокачку
    material: RED_DYE
    name: "&7"
    lore:
      - ""
      - "&#FFB400 ⎧&r &fРазблокировать"
      - "&#FFB400 ⎪ &r &fслоты можно только"
      - "&#FFB400 ⎩&r &fпоследовательно"
      - ""